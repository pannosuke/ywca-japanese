name: Android

on:
  push:
    branches:
      - main
      - "cursor/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Test and build a debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "name='dev.ericallerton.yoruben'" /tmp/badging.txt
          grep -q "versionCode='8'" /tmp/badging.txt
          grep -q "versionName='0.5.2'" /tmp/badging.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add Actions secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD. An unsigned APK is not published."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/yoruben-release.p12"
          test -s "$RUNNER_TEMP/yoruben-release.p12"
      - name: Build and verify the signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/yoruben-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD are required. An unsigned APK is not published."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK"
          VER="${GITHUB_REF_NAME#v}"
          cp "$APK" "yoruben-${VER}.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "yoruben-${VER}.apk" | tee /tmp/badging.txt
          grep -q "name='dev.ericallerton.yoruben'" /tmp/badging.txt
          grep -q "versionCode='8'" /tmp/badging.txt
          grep -q "versionName='0.5.2'" /tmp/badging.txt
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: yoruben-*.apk
          fail_on_unmatched_files: true
