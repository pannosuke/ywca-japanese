name: Android

on:
  push:
    branches:
      - main
      - "cursor/**"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Lint, test, and debug APK
        run: ./gradlew lint test assembleDebug --stacktrace

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Point Gradle at the SDK
        run: echo "sdk.dir=$ANDROID_HOME" >> local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Add Actions secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD. See README. An unsigned APK is not published, so a later signed build can still be the first Obtainium install."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/yoruben-release.p12"
          test -s "$RUNNER_TEMP/yoruben-release.p12"
      - name: Build the signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/yoruben-release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace
      - name: Collect the APK
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' ! -name '*unsigned*' | head -1)
          test -n "$APK"
          VER="${GITHUB_REF_NAME#v}"
          cp "$APK" "yoruben-${VER}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: yoruben-*.apk
          generate_release_notes: true
